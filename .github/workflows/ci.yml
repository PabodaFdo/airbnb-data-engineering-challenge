name: CI - Python Tests

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: .

    steps:
      # ---------------------------------------------------------------
      # 1. Download repository source code
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Configure Python
      # ---------------------------------------------------------------
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ---------------------------------------------------------------
      # 3. Upgrade package installer
      # ---------------------------------------------------------------
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # ---------------------------------------------------------------
      # 4. Install project dependencies
      # ---------------------------------------------------------------
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # ---------------------------------------------------------------
      # 5. Verify Python syntax
      # ---------------------------------------------------------------
      - name: Compile project modules
        run: python -m compileall -q run_pipeline.py src tests

      # ---------------------------------------------------------------
      # 6. Run automated tests
      # ---------------------------------------------------------------
      - name: Run automated tests
        run: python -m pytest tests/ -v